framework:
    messenger:
        failure_transport: failed_storage

        transports:
            async_normal:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    exchange:
                        name: jobs.test.exchange
                        type: direct
                        default_publish_routing_key: normal
                    queues:
                        jobs.test.normal:
                            binding_keys:
                                - normal
                retry_strategy:
                    max_retries: 0

            async_priority:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    exchange:
                        name: jobs.test.exchange
                        type: direct
                        default_publish_routing_key: priority
                    queues:
                        jobs.test.priority:
                            binding_keys:
                                - priority
                retry_strategy:
                    max_retries: 0

            async_dead_letter:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    exchange:
                        name: jobs.test.dead_letter
                        type: fanout
                    queues:
                        jobs.test.dead_letter: ~
                retry_strategy:
                    max_retries: 0

            failed_storage:
                dsn: 'doctrine://default?queue_name=failed_jobs_test'
                retry_strategy:
                    max_retries: 0