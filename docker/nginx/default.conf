server {
    listen 80;
    listen [::]:80;

    server_name _;

    root /var/www/html/public;
    index index.php;

    charset utf-8;

    client_max_body_size 20M;

    # Healthcheck propre à Nginx
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "nginx ok\n";
    }

    # Toutes les requêtes applicatives passent par Symfony
    location / {
        try_files $uri /index.php$is_args$args;
    }

    # Seul index.php peut être exécuté par PHP-FPM
    location ~ ^/index\.php(/|$) {
        fastcgi_pass app:9000;

        fastcgi_split_path_info ^(.+\.php)(/.*)$;

        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
        fastcgi_param HTTP_PROXY "";

        fastcgi_read_timeout 300;

        internal;
    }

    # Interdire l'exécution directe d'autres fichiers PHP
    location ~ \.php$ {
        return 404;
    }

    # Bloquer l'accès aux fichiers cachés
    location ~ /\.(?!well-known).* {
        deny all;
    }
}