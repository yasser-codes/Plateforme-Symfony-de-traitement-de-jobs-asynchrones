services:
  # ==========================================================
  # 1. APPLICATION SYMFONY / PHP-FPM
  # ==========================================================
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: php_fpm_dev

    restart: unless-stopped

    working_dir: /var/www/html

    volumes:
      - ./app:/var/www/html

    environment:
      APP_ENV: "${APP_ENV:-dev}"
      APP_DEBUG: "${APP_DEBUG:-1}"
      APP_SECRET: "${APP_SECRET}"

      APP_BOOTSTRAP: "1"

      DATABASE_HOST: db
      DATABASE_PORT: "5432"
      DATABASE_WAIT_TIMEOUT: "60"

      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?serverVersion=16&charset=utf8"

      REDIS_URL: "redis://redis:6379"

      API_CACHE_TTL: "${API_CACHE_TTL:-60}"

      RABBITMQ_DEFAULT_USER: "${RABBITMQ_DEFAULT_USER:-app}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_DEFAULT_PASS:-app_password}"
      RABBITMQ_DEFAULT_VHOST: "${RABBITMQ_DEFAULT_VHOST:-jobs}"

      MESSENGER_TRANSPORT_DSN: "amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672/${RABBITMQ_DEFAULT_VHOST}"
      
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

    networks:
      - frontend
      - backend

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "SCRIPT_NAME=/fpm-ping SCRIPT_FILENAME=/fpm-ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 2>/dev/null | grep -q pong"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s


  # ==========================================================
  # 2. NGINX
  # ==========================================================
  nginx:
    image: nginx:alpine

    restart: unless-stopped

    ports:
      - "${HTTP_PORT:-80}:80"

    volumes:
      - ./app:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      app:
        condition: service_healthy

    networks:
      - frontend

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --quiet --output-document=- http://127.0.0.1/healthz | grep -q 'nginx ok'"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


  # ==========================================================
  # 3. POSTGRESQL 16
  # ==========================================================
  db:
    image: postgres:16-alpine

    restart: unless-stopped

    environment:
      POSTGRES_DB: "${POSTGRES_DB:-jobs}"
      POSTGRES_USER: "${POSTGRES_USER:-app}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-app_password}"

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - backend

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s


  # ==========================================================
  # 4. REDIS 7
  # ==========================================================
  redis:
    image: redis:7-alpine

    restart: unless-stopped

    command:
      - redis-server
      - --appendonly
      - "yes"

    ports:
      - "${REDIS_PORT:-6379}:6379"

    volumes:
      - redis_data:/data

    networks:
      - backend

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli ping | grep -q PONG"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s


  # ==========================================================
  # 5. RABBITMQ 3 + INTERFACE MANAGEMENT
  # ==========================================================
  rabbitmq:
    image: rabbitmq:3-management-alpine

    restart: unless-stopped

    hostname: rabbitmq

    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_DEFAULT_USER:-app}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_DEFAULT_PASS:-app_password}"
      RABBITMQ_DEFAULT_VHOST: "${RABBITMQ_DEFAULT_VHOST:-jobs}"

    ports:
      - "5672:5672"
      - "15672:15672"

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

    networks:
      - backend
      - management

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "rabbitmq-diagnostics -q ping"
        ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s


  # ==========================================================
  # 6. WORKER GÉNÉRAL
  # ==========================================================
  worker-1:
    build:
      context: .
      dockerfile: docker/worker/Dockerfile
      target: worker_dev

    restart: unless-stopped
    init: true

    working_dir: /var/www/html

    volumes:
      - ./app:/var/www/html

    environment:
      APP_ENV: dev
      APP_DEBUG: "1"
      APP_SECRET: "${APP_SECRET:-temporary-dev-secret}"

      WORKER_NAME: worker-1
      WORKER_TRANSPORT: async_normal

      DATABASE_URL: "postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app_password}@db:5432/${POSTGRES_DB:-jobs}?serverVersion=16&charset=utf8"

      REDIS_URL: "redis://redis:6379"
      API_CACHE_TTL: "${API_CACHE_TTL:-60}"

      MESSENGER_TRANSPORT_DSN: "amqp://${RABBITMQ_DEFAULT_USER:-app}:${RABBITMQ_DEFAULT_PASS:-app_password}@rabbitmq:5672/${RABBITMQ_DEFAULT_VHOST:-jobs}"

    command:
        - php
        - bin/console
        - messenger:consume
        - async_normal
        - --time-limit=3600
        - --memory-limit=256M
        - --limit=100
        - --sleep=1
        - -vv

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

    networks:
      - backend

    healthcheck:

      test:
        - CMD-SHELL
        - 'pgrep -f "messenger:consume async_normal" > /dev/null || exit 1'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s


  # ==========================================================
  # 7. WORKER PRIORITAIRE
  # ==========================================================
  worker-2:
    build:
      context: .
      dockerfile: docker/worker/Dockerfile
      target: worker_dev

    restart: unless-stopped
    init: true

    working_dir: /var/www/html

    volumes:
      - ./app:/var/www/html

    environment:
      APP_ENV: dev
      APP_DEBUG: "1"
      APP_SECRET: "${APP_SECRET:-temporary-dev-secret}"

      WORKER_NAME: worker-2
      WORKER_TRANSPORT: async_priority

      DATABASE_URL: "postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app_password}@db:5432/${POSTGRES_DB:-jobs}?serverVersion=16&charset=utf8"

      REDIS_URL: "redis://redis:6379"
      API_CACHE_TTL: "${API_CACHE_TTL:-60}"

      MESSENGER_TRANSPORT_DSN: "amqp://${RABBITMQ_DEFAULT_USER:-app}:${RABBITMQ_DEFAULT_PASS:-app_password}@rabbitmq:5672/${RABBITMQ_DEFAULT_VHOST:-jobs}"

    command:
        - php
        - bin/console
        - messenger:consume
        - async_priority
        - --time-limit=3600
        - --memory-limit=512M
        - --limit=100
        - --sleep=1
        - -vv

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

    networks:
      - backend

    healthcheck:
      disable: true
      test:
          - CMD-SHELL
          - 'pgrep -f "messenger:consume async_priority" > /dev/null || exit 1'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s


  # ==========================================================
  # 8. WORKER DEAD LETTER
  # ==========================================================
  worker-dead-letter:
    build:
      context: .
      dockerfile: docker/worker/Dockerfile
      target: worker_dev

    restart: unless-stopped
    init: true

    working_dir: /var/www/html

    volumes:
      - ./app:/var/www/html

    environment:
      APP_ENV: dev
      APP_DEBUG: "1"
      APP_SECRET: "${APP_SECRET:-temporary-dev-secret}"

      WORKER_NAME: worker-dead-letter
      WORKER_TRANSPORT: async_dead_letter

      DATABASE_URL: "postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app_password}@db:5432/${POSTGRES_DB:-jobs}?serverVersion=16&charset=utf8"

      REDIS_URL: "redis://redis:6379"
      API_CACHE_TTL: "${API_CACHE_TTL:-60}"

      MESSENGER_TRANSPORT_DSN: "amqp://${RABBITMQ_DEFAULT_USER:-app}:${RABBITMQ_DEFAULT_PASS:-app_password}@rabbitmq:5672/${RABBITMQ_DEFAULT_VHOST:-jobs}"

    command:
        - php
        - bin/console
        - messenger:consume
        - async_dead_letter
        - --time-limit=3600
        - --memory-limit=256M
        - --limit=100
        - --sleep=1
        - -vv

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

    networks:
      - backend

    healthcheck:
      disable: true
      test:
        [
          "CMD-SHELL",
          "test -f /tmp/worker-ready && kill -0 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


# ============================================================
# VOLUMES PERSISTANTS
# ============================================================
volumes:
  postgres_data:
    driver: local

  redis_data:
    driver: local

  rabbitmq_data:
    driver: local


# ============================================================
# RÉSEAUX
# ============================================================
networks:
  frontend:
    driver: bridge

  backend:
    driver: bridge
    internal: true
    
  management:
    driver: bridge