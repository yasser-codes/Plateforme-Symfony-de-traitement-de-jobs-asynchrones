name: CI

on:
  push:
    branches:
      - main
      - master
      - develop

  pull_request:

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app

    env:
      APP_ENV: test
      APP_DEBUG: 1
      APP_SECRET: github-actions-test-secret
      DATABASE_URL: postgresql://app:app@127.0.0.1:5432/jobs?serverVersion=16&charset=utf8
      REDIS_URL: redis://127.0.0.1:6379
      MESSENGER_TRANSPORT_DSN: amqp://guest:guest@127.0.0.1:5672/%2f

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: pcov
          extensions: amqp, intl, pdo_pgsql, redis
          tools: composer:v2

      - name: Prepare CI environment
        run: |
          cat > .env <<'EOF'
          APP_ENV=test
          APP_DEBUG=1
          APP_SECRET=github-actions-test-secret
          DEFAULT_URI=http://localhost
          DATABASE_URL="postgresql://app:app@127.0.0.1:5432/jobs?serverVersion=16&charset=utf8"
          REDIS_URL="redis://127.0.0.1:6379"
          MESSENGER_TRANSPORT_DSN="amqp://guest:guest@127.0.0.1:5672/%2f"
          EOF

      - name: Validate Composer files
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress --no-scripts

      - name: Build Symfony test container
        run: |
          APP_ENV=test APP_DEBUG=1 php bin/console cache:clear --env=test
          APP_ENV=test APP_DEBUG=1 php bin/console cache:warmup --env=test

      - name: PHP-CS-Fixer dry-run
        run: vendor/bin/php-cs-fixer fix --dry-run --diff --config=.php-cs-fixer.dist.php

      - name: PHPStan level 9
        run: |
          vendor/bin/phpstan analyse \
            --configuration=phpstan.dist.neon \
            --memory-limit=1G

      - name: Rector dry-run
        run: vendor/bin/rector process --dry-run --config=rector.php

  tests:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare environment file
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            touch .env
          fi

          if [ -f app/.env.example ]; then
            cp app/.env.example app/.env
          else
            touch app/.env
          fi

          cat >> .env <<'EOF'
          APP_ENV=test
          APP_DEBUG=1
          APP_SECRET=github-actions-test-secret
          DEFAULT_URI=http://localhost
          DATABASE_URL=postgresql://app:app@db:5432/jobs?serverVersion=16&charset=utf8
          REDIS_URL=redis://redis:6379
          MESSENGER_TRANSPORT_DSN=amqp://guest:guest@rabbitmq:5672/%2f
          EOF

          cat >> app/.env <<'EOF'
          APP_ENV=test
          APP_DEBUG=1
          APP_SECRET=github-actions-test-secret
          DEFAULT_URI=http://localhost
          DATABASE_URL=postgresql://app:app@db:5432/jobs?serverVersion=16&charset=utf8
          REDIS_URL=redis://redis:6379
          MESSENGER_TRANSPORT_DSN=amqp://guest:guest@rabbitmq:5672/%2f
          EOF

      - name: Build Docker images
        run: docker compose build

      - name: Start complete platform
        run: |
          if ! docker compose up -d; then
            docker compose ps
            docker compose logs --no-color --tail=300 app
            exit 1
          fi

      - name: Prepare test database
        run: |
          docker compose exec -T app \
            php bin/console doctrine:database:create --if-not-exists --env=test

          docker compose exec -T app \
            php bin/console doctrine:schema:drop \
              --force \
              --full-database \
              --env=test

          docker compose exec -T app \
            php bin/console doctrine:schema:create --env=test

      - name: Validate database schema
        run: |
          docker compose exec -T app \
            php bin/console doctrine:schema:validate --env=test

      - name: Setup Messenger transports
        run: |
          docker compose exec -T app \
            php bin/console messenger:setup-transports --env=test

      - name: Run PHPUnit
        run: |
          docker compose exec -T app \
            php bin/phpunit

      - name: Show logs on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --tail=200

      - name: Stop platform
        if: always()
        run: docker compose down -v

  build:
    name: Docker build
    runs-on: ubuntu-latest

    needs:
      - quality
      - tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare environment file
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Build all images
        run: docker compose build