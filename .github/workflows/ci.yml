name: CI

on:
  push:
    branches:
      - main
      - master
      - develop

  pull_request:

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app

    env:
      APP_ENV: test
      APP_DEBUG: 1
      APP_SECRET: github-actions-test-secret
      DATABASE_URL: postgresql://app:app@127.0.0.1:5432/jobs?serverVersion=16&charset=utf8
      REDIS_URL: redis://127.0.0.1:6379
      MESSENGER_TRANSPORT_DSN: amqp://guest:guest@127.0.0.1:5672/%2f

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: pcov
          extensions: amqp, intl, pdo_pgsql, redis
          tools: composer:v2

      - name: Prepare CI environment
        run: |
          cat > .env <<'EOF'
          APP_ENV=test
          APP_DEBUG=1
          APP_SECRET=github-actions-test-secret
          DEFAULT_URI=http://localhost
          DATABASE_URL="postgresql://app:app@127.0.0.1:5432/jobs?serverVersion=16&charset=utf8"
          REDIS_URL="redis://127.0.0.1:6379"
          MESSENGER_TRANSPORT_DSN="amqp://guest:guest@127.0.0.1:5672/%2f"
          EOF

      - name: Validate Composer files
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress --no-scripts

      - name: Build Symfony test container
        run: |
          APP_ENV=test APP_DEBUG=1 php bin/console cache:clear --env=test
          APP_ENV=test APP_DEBUG=1 php bin/console cache:warmup --env=test

      - name: PHP-CS-Fixer dry-run
        run: vendor/bin/php-cs-fixer fix --dry-run --diff --config=.php-cs-fixer.dist.php

      - name: PHPStan level 9
        run: |
          vendor/bin/phpstan analyse \
            --configuration=phpstan.dist.neon \
            --memory-limit=1G

      - name: Rector dry-run
        run: vendor/bin/rector process --dry-run --config=rector.php

  tests:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare environment file
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi

      - name: Build Docker images
        run: docker compose build

      - name: Start complete platform
        run: docker compose up -d

      - name: Display containers
        run: docker compose ps

      - name: Wait for application
        run: |
          echo "Waiting for the application..."

          for i in {1..30}; do
            if curl --fail --silent http://localhost/health > /dev/null; then
              echo "Application is ready."
              exit 0
            fi

            echo "Attempt $i/30..."
            sleep 5
          done

          echo "Application did not become ready."
          docker compose ps
          docker compose logs
          exit 1

      - name: Validate database schema
        run: |
          docker compose exec -T app \
            php bin/console doctrine:schema:validate

      - name: Setup Messenger transports
        run: |
          docker compose exec -T app \
            php bin/console messenger:setup-transports

      - name: Run PHPUnit
        run: |
          docker compose exec -T app \
            php bin/phpunit

      - name: Show logs on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --tail=200

      - name: Stop platform
        if: always()
        run: docker compose down -v

  build:
    name: Docker build
    runs-on: ubuntu-latest

    needs:
      - quality
      - tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare environment file
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Build all images
        run: docker compose build